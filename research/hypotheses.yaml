  stage: O
  priority: 3
  status: open
  statement: Observer effects inside a cell manufacture change.
  test: Observer terms; how much of the ceiling survives.
  kill: Ceiling unchanged with observer terms.
  blr: If true, ceilings shrink; part of 'unexplained change' is observation.
  parents: []
  evidence:
  - {job: "adhoc:E021-dev", exp: E021, dir: for, strength: moderate, note: "observer turnover is ~29% [25, 33] of species and 28-29% of ESK early->modern change energy (within-modern design by observer continuity); 81% of cells share no observer between epochs. Every change target is diluted by it (defect A14). Found by the skeptic, reproduced."}
  - {job: "skeptic3:E013", exp: E013, dir: for, strength: moderate, note: "observer co-movement inflates the observed-community arm of E013 by 33-45% of its numerator (DESK ~0); adjusted, DESK matches the true community in trained years and reaches 41-52% of it in withheld decades."}
