# Hypothesis register. The loop extends, merges, and retires entries; nothing is deleted (use status).
# status: open | testing | supported | refuted | superseded | parked
# priority: 1 = run first (null/instrument + cheapest downstream levers), 2, 3
# kill: the written criterion that would refute it. blr: what it implies for the downstream regression if true.
# evidence: list of {job: <registry job id>, exp: EXXX, dir: for|against|neutral, strength: weak|moderate|strong, note}
# Only VERIFIED results (PROTOCOL.md gate) may move status to supported/refuted.

# ---------------- null and instrument: is there resolvable, habitat-related change to explain? ----------------
- id: E1
  stage: E
  priority: 1
  status: testing
  statement: Most cell-level change is noise, so no_change is near-unbeatable on RMSE even for a perfect habitat model.
  test: Planted calibration (Phase 1.4) on the real route-year keys; achievable change skill vs temporal-signal share.
  kill: A planted perfect-kernel species with realistic temporal share achieves change skill well above the observed DESK skill.
  blr: If true, change RMSE skill is the wrong headline; use captured share of resolvable change and attenuation slope.
  parents: []
  evidence:
  - {job: "E007/planted-tempho1995-b3091e48eefb", exp: E007, dir: for, strength: weak, note: "pilot, 12 species/generator: a perfect-form z readout reaches TRUE change attenuation 0.2-0.75, rising with prevalence; below 10% prevalence the true change is <3% of observed change variance. E009 (60/generator) queued. UNVERIFIED."}
  - {job: "skeptic:E009", exp: E009, dir: neutral, strength: moderate, note: "the E009 ceiling is a perfect DESK (z generator = DESK z). Species linear in the smoothed OBSERVED community, seen through DESK, reach only 0.04-0.09 true attenuation; real species sit at 0.02-0.25x of that. ~85-90% of the gap to E009 ceiling is DESK backcast."}
- id: T0
  stage: T
  priority: 1
  status: testing
  statement: DESK's temporal under-movement is the MSE-optimal shrinkage toward unreliable within-cell targets, not a defect.
  test: Per-component attenuation slope of DESK dz on ESK dz vs the split-half reliability of ESK dz.
  kill: Attenuation slopes sit clearly below the reliability (DESK shrinks more than noise justifies).
  blr: If true, the fix is target reliability (pooling, smoothing, longer windows), not DESK capacity or loss.
  parents: []
  evidence:
  - {job: "E004/atlas-base-trained-6e20bd69e4b0", exp: E004, dir: against, strength: moderate, note: "per-component change reliability 0.73-0.89 vs DESK raw slope 0.04-0.66 (median ~0.3). Reframe: DESK's temporal energy/signal 0.54 exceeds corr^2 0.24, i.e. it moves MORE than a calibrated predictor with its correlation (0.49) would; the limit is information, not shrinkage. UNVERIFIED."}
  - {job: "skeptic:E004", exp: E004, dir: against, strength: moderate, note: "robust to centering: slope of truth on DESK 0.425 vs corr^2 0.165 (trained), 0.331 vs 0.045 (withheld) - DESK over-moves for its information; a calibrated DESK would be shrunk x0.62 / x0.37."}
- id: O3
  stage: O
  priority: 1
  status: testing
  statement: Route turnover between epochs survives the ABBA year split and is counted as real change, inflating every ceiling.
  test: Noise ceiling and atlas on cells with the same routes in both epochs vs all cells.
  kill: Same-route and all-cell ceilings agree within bootstrap CI.
  blr: If true, every 'share of available change' denominator is too large; DESK is closer to the real ceiling than reported.
  parents: []
  evidence:
  - {job: "E008/route-ceiling-gp_species_base-fd61e474bade", exp: E008, dir: against, strength: moderate, note: "same-route cells carry 11% less real change per cell than route-turnover cells (dev species, block-bootstrap CI excludes 0; community total 19%); removing it lowers the all-cell budget ~3% (dev) / ~6% (total). Detectable, not a big factor. CI from an interactive run; E008 rerun queued. UNVERIFIED."}
- id: C1
  stage: O
  priority: 1
  status: open
  statement: Much same-cell change is a continental shift in total abundance, not composition, and belongs to the K trend.
  test: Split each cell's change into log-total and composition (relative abundance) parts; map and size each.
  kill: The composition part carries most of the resolvable change.
  blr: If true, a time basis (K trend) or per-species trend term, not z, should carry the bulk shift.
  parents: []
  evidence: []
- id: E4
  stage: E
  priority: 1
  status: testing
  statement: The independent oracle is weak partly through errors-in-variables (noisy half-window community features) or off-span projection.
  test: Oracle on planted species with full vs half windows; report split-half reliability of oracle z and the norm ratio.
  kill: Half-window oracle skill matches full-window skill on planted species and the norm ratio is near 1.
  blr: If true, the oracle understates the representational ceiling; 'oracle weak too' is partly an artifact.
  parents: []
  evidence:
  - {job: "adhoc:E011-dev", exp: E011, dir: for, strength: weak, note: "observed half-window ESK features read through a level beta do WORSE than DESK z (captured 0.04 vs 0.10, base r24); with change-fitted beta they tie (0.26 vs 0.25). The noisy observed community is a weak oracle. UNVERIFIED."}
  - {job: "skeptic:E011", exp: E011, dir: for, strength: moderate, note: "errors-in-variables confirmed and sized: half-A noise turns the true-community level readout from ~0/+0.09 into -0.05/+0.04 (tempho1995/base)."}
- id: P1
  stage: O
  priority: 1
  status: testing
  statement: Held-out species' decadal change is mostly continental trend plus colonization fronts, which belong to the mechanistic model, not habitat.
  test: Decompose change into year effects, distance-to-range-edge terms, and local residual; size each per species.
  kill: The local residual carries most of the resolvable change for range-stable species.
  blr: If true, grade DESK on range-stable species; fronts are the age model's dispersal job.
  parents: []
  evidence:
  - {job: "adhoc:E011-dev", exp: E011, dir: neutral, strength: weak, note: "continental trend alone captures 9% of available change; community-driven change (chg_dev) 17-21%; both 25-29%. >70% of resolvable species change is not linear in community change + trend. UNVERIFIED."}
- id: E2
  stage: E
  priority: 2
  status: open
  statement: The graded species are mostly migrants and niches off the community's selection axes, so pooled medians answer a generality question.
  test: Stratify every metric by migration class and by distance to the community on its selection axes (community_axes.py).
  kill: Skill does not differ by stratum.
  blr: If true, decisions for House Finch use the near-community stratum.
  parents: []
  evidence: []
- id: E3
  stage: E
  priority: 2
  status: open
  statement: tempho_1975's time group sits 1-10 y from trained data while the downstream gap is 26-64 y, so it flatters DESK and the spacetime GP alike.
  test: Skill vs years beyond the training edge, pooled across tempho runs; lead with tempho_1995.
  kill: Skill is flat in reach.
  blr: If true, only long-reach results speak to 1902-1939.
  parents: []
  evidence: []

# ---------------- representation (ESK) ----------------
- id: R1
  stage: R
  priority: 1
  status: testing
  statement: (user) Spatial turnover dwarfs temporal turnover, so eigen-ordering and truncation keep spatial structure and drop temporal structure.
  test: Atlas noise-corrected temporal vs spatial retention at r=6/24/64, inside vs outside the top-k subspace, matched at equal exact-kernel distance.
  kill: At matched exact-kernel distance, temporal retention equals spatial retention (truncation drops small differences, not temporal directions).
  blr: If true, the positional 24-dim cut and the eigenvalue-proportional prior both discard the backcast signal.
  parents: []
  evidence:
  - {job: "E004/atlas-base-trained-6e20bd69e4b0", exp: E004, dir: against, strength: moderate, note: "strong form: at matched exact-kernel size temporal retention r24 0.228 [0.216,0.238] vs spatial (lag 1) 0.232 [0.223,0.241]; r6 0.067 vs 0.084, r64 0.391 vs 0.388. The 40-y change (exact 0.430) is SMALLER than the adjacent-cell difference (0.482), so lag 1 is an upper bound on the matched spatial value. Truncation drops small differences, not temporal directions. UNVERIFIED."}
  - {job: "skeptic:E004", exp: E004, dir: for, strength: weak, note: "the matched-size equality is confounded by a between-route spatial nugget (fits 0.14-0.30 of lag 1; ESK keeps ~none): against the STRUCTURED spatial part r24 retention is 0.36-0.62 vs temporal 0.23-0.31 (ratio 0.4-0.7, strong form), and the 40-y change is ~90-110 km, not < 27 km. Undetermined until the nugget is measured directly (N1)."}
  - {job: "adhoc:E014-dev", exp: E014, dir: against, strength: moderate, note: "route-level, effort-matched: the nugget is large (0.29 at < 10 km) but ESK keeps ~24% of it; temporal retention equals spatial at the same raw size (0.280 vs 0.273); the regionally coherent part of the 40-y change is kept at 45-71% (r24), as well as structured spatial differences; only the route-specific remainder is dropped (~6%). Strong form not supported. UNVERIFIED; replication queued."}
- id: R2p
  stage: R
  priority: 2
  status: open
  statement: "||z|| measures how well a community is represented; poorer representation of early or window communities reads as change."
  test: "||z||^2 by epoch and region; BLR change skill on normalized vs raw z."
  kill: "||z||^2 is flat across epochs and normalization does not change change skill."
  blr: If true, part of predicted change is representational artifact.
  parents: []
  evidence: []
- id: R3
  stage: R
  priority: 3
  status: open
  statement: Landmarks and eigenpairs favour the dense modern, coastal record.
  test: Nystrom kernel error by era and distance to coast.
  kill: Kernel error flat by era and coast distance.
  blr: If true, early-era z is less faithful exactly where backcasts need it.
  parents: []
  evidence: []
- id: R5
  stage: R
  priority: 2
  status: open
  statement: The 96 reference species do not span out-of-community species' niches.
  test: Independent oracle and direct regression on the 96 observed abundances, by guild and migration class.
  kill: Direct regression on the 96 abundances predicts held-out species about as well as the full species pool would.
  blr: If true, z is the wrong basis for off-axis species regardless of DESK.
  parents: []
  evidence: []
- id: R6
  stage: R
  priority: 2
  status: open
  statement: The 96 were chosen for spatial discrimination and under-represent temporal change.
  test: Temporal share of change in the 96 vs all species vs random 96-species draws.
  kill: The 96 carry a typical temporal share.
  blr: If true, community choice itself limits temporal signal; a temporally informative community would help.
  parents: []
  evidence: []

# ---------------- transfer (DESK) ----------------
- id: T1
  stage: T
  priority: 2
  status: open
  statement: L_stab (~90% of loss, equal weight per cell-year) plus almost no same-cell cross-year metric pairs make shrinking temporal deviations optimal.
  test: DESK error split between/within cells; ridge-surrogate frontier of spatial vs temporal fit as the within-cell weight rises.
  kill: The surrogate frontier is flat (more within-cell weight buys no temporal fit) or DESK already sits on it.
  blr: If true, reweighting training toward within-cell change is the lever.
  parents: []
  evidence: []
- id: T2
  stage: T
  priority: 3
  status: open
  statement: Temporal information exists inside DESK but is suppressed at the head.
  test: Linear probe from hidden activations vs from z to ESK within-cell deviations.
  kill: Probe on activations does no better than on z.
  blr: If true, a head-only retrain could recover temporal signal cheaply.
  parents: []
  evidence: []
- id: T3
  stage: T
  priority: 3
  status: open
  statement: Standardizing covariates on the 2025 spatial spread makes temporal anomalies tiny inputs, and static streams give a location shortcut.
  test: Per-channel within/between SD ratios; counterfactual swaps of dynamic streams across years; per-stream Jacobian norms.
  kill: Dynamic streams drive z change in proportion to their temporal variance.
  blr: If true, anomaly-standardized inputs or explicit change features are the lever.
  parents: []
  evidence: []
- id: T4
  stage: T
  priority: 2
  status: testing
  statement: Space-for-time mismatch - spatial covariate-to-community slopes differ from temporal slopes.
  test: Mundlak within/between regression of ESK components on covariates; the sign of the gap predicts over- vs under-movement.
  kill: Within and between slopes agree.
  blr: If true, no spatially trained map can backcast correctly without temporal supervision.
  parents: []
  evidence:
  - {job: "adhoc:E011-dev", exp: E011, dir: for, strength: weak, note: "the readout analogue (community->species): level-fitted beta on community change captures 4-10% (base) / -5% (tempho1995 withheld) of available species change; change-fitted beta on the SAME features 25-29%. Interactive development run; E011 jobs queued. UNVERIFIED."}
  - {job: "adhoc:E016-dev", exp: E016, dir: for, strength: moderate, note: "covariate->community map fitted in the trained era: between-cell (spatial) coefficients predict NONE of the temporal community change (corr 0.03 trained / 0.02 backcast); within-cell coefficients 0.42 / 0.27, as good as DESK (0.41 / 0.21) and better calibrated (0.91 / 0.75 vs 0.62 / 0.37). UNVERIFIED; replications queued."}
  - {job: "skeptic3:E016", exp: E016, dir: neutral, strength: moderate, note: "pure space-for-time predicts none of the decadal change (single-year cross-section betas -0.03 to +0.01 in every cache; robust). But the within-cell advantage is regional TREND persistence: a position x time placebo with no covariates matches or beats the within map (covariates add +0.03-0.05). The lever is not within-cell coefficients."}
- id: T6
  stage: T
  priority: 2
  status: open
  statement: Output and input EMAs smooth away change, and the shipped raw z is not what was supervised.
  test: Temporal spectra of target, z_ema, raw z; grade both with raw z after a fitted lag.
  kill: Raw z with a fitted lag matches z_ema's skill and the spectra agree.
  blr: If true, the age model receives a temporally unvalidated object.
  parents: []
  evidence: []
- id: T9
  stage: T
  priority: 3
  status: open
  statement: 1902-1939 covariates fall outside training support (EMA warm-up from 1940; sparser climate stations; HYDE decadal pre-1951; BUI 5-yearly, CONUS-only).
  test: Per-year covariate novelty; raw z behaviour 1902-1965.
  kill: 1902-1939 novelty within the 1966-2025 range and raw z smooth across 1940.
  blr: If true, backcast uncertainty must grow before 1940 and the BLR has no mechanism for it.
  parents: []
  evidence: []
- id: T5
  stage: T
  priority: 3
  status: open
  statement: The drivers of real community change are not in the covariates (pesticides, forest maturation, WNV, CRP, feeders, invasions). Testable only by elimination.
  test: High-capacity delta-covariate to delta-community model vs a covariate-free regional smoother.
  kill: Covariate-change model explains most resolvable change.
  blr: If true, a temporal residual term (B5) is mandatory.
  parents: []
  evidence:
  - {job: "skeptic3:E016", exp: E016, dir: for, strength: moderate, note: "covariate change adds only +0.025-0.053 beyond position x time trends in predicting held-out decadal community change; a within map on cell-detrended covariate anomalies scores ~0."}
# ---------------- readout (BLR): the downstream lever ----------------
  - {job: "E027/desk-plus-covariate-blocks-6977de015080", exp: E027, dir: for, strength: weak, note: "neither nonlinear (RFF) nor multi-timescale covariate surrogates extend the reach beyond the best short-span fit, and they add little to DESK's z: the covariates' decadal temporal content looks largely used already. UNVERIFIED."}
- id: B1
  stage: B
  priority: 1
  status: testing
  statement: The isotropic prior under-weights low-variance (temporal) directions.
  test: Fast arm with split kernel s_b^2 zbar.zbar' + s_w^2 dz.dz' (zbar over a fixed reference window), ARD, whitened z; learned s_w^2/s_b^2.
  kill: Learned s_w^2/s_b^2 near 1 and no change-skill gain.
  blr: If true, adopt a block prior (iid within blocks) - a contract change for the age model.
  parents: []
  evidence:
  - {job: "E005/fastarm-gp_species_base-6969e4d243e8", exp: E005, dir: neutral, strength: weak, note: "split kernel gains change skill (+0.018 [0.005,0.033] vs +0.001 base; +0.002 vs -0.016 tempho1995 time) but learned per-feature amplitude dz/zbar is 0.58 (base) and 0.09 (tempho1995): the data want LESS weight on deviations, not more. The gain is separate coefficients (direction), see B7. UNVERIFIED."}
- id: B2
  stage: B
  priority: 2
  status: open
  statement: z.z' implies corr(H(x,1920), H(x,2000)) near 1, producing confident wrong backcasts.
  test: Implied vs empirical temporal autocorrelation of abundance; interval coverage in withheld decades.
  kill: Coverage nominal in withheld decades.
  blr: If true, backcast intervals are overconfident; add a temporal residual or block prior.
  parents: []
  evidence: []
- id: B4
  stage: B
  priority: 2
  status: open
  statement: A constant per-species mean leaves continental and regional trends to z, which has no time direction.
  test: Decompose species change and attribute each part; include the K-trend time basis in the fast arm.
  kill: Adding the time basis changes nothing.
  blr: If true, the K trend (and analogues for other rates) must carry trends z cannot.
  parents: [C1]
  evidence: []
- id: B5
  stage: B
  priority: 3
  status: open
  statement: A temporal residual (region x decade, or a long-lengthscale spacetime GP) restores coverage without costing spatial skill.
  test: Fast arm with and without it.
  kill: No coverage gain or a spatial cost beyond seed noise.
  blr: If true, an interpretable residual kernel joins z.z' in the age model.
  parents: [B2]
  evidence:
  - {job: "E028/persistence-observer-f55be4d54c07", exp: E028, dir: for, strength: weak, note: "local deviations from the regional surface fade by ~8% per 11 years even with the same observers: a damped cell residual would carry real (if small) backcast information. UNVERIFIED."}

- id: B6
  stage: B
  priority: 2
  status: open
  statement: A persistent spatial residual captures the level structure the spacetime GP exploits, leaving z to carry change.
  test: Fast arm with and without a static spatial residual; level and change by group.
  kill: No level gain in the time/space_time groups.
  blr: If true, 'loses to spacetime GP' is about level, not change; a static residual field fixes it.
  parents: []
  evidence: []
- id: F1
  stage: B
  priority: 2
  status: open
  statement: A static block plus a few interpretable covariate-change features serves the BLR as well as DESK raw z.
  test: Fast arm change skill, coverage and backcast slope vs DESK.
  kill: DESK raw z clearly better on all three.
  blr: If true, a simpler, interpretable feature map is a candidate downstream input.
  parents: []
  evidence: []
- id: L1
  stage: B
  priority: 2
  status: open
  statement: Abundance lags habitat; raw z is penalized without a lag while z_ema double-lags against the age model's own dynamics.
  test: Per-species fitted lag on raw z; compare fitted lags with generation time.
  kill: Fitted lags near zero.
  blr: If true, grading raw z unlagged understates it; the age model's dynamics supply the lag.
  parents: [T6]
  evidence: []
- id: I1
  stage: B
  priority: 3
  status: open
  statement: Raw z's year-to-year weather signal matters for vital rates but epoch means score it as noise.
  test: Ceiling from splitting routes within each cell-year vs raw-z annual anomalies.
  kill: Annual anomalies carry no resolvable signal.
  blr: If true, annual (not epoch) metrics are needed for survival-like rates.
  parents: []
  evidence: []

# ---------------- observation ----------------
