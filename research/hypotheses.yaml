# ---------------- added 2026-10-09 from the first real-data results ----------------
- id: B7
  stage: B
  priority: 1
  status: testing
  statement: The readout's level-fitted beta (space) does not transfer to temporal community change - read through spatial betas, z's temporal change predicts species change worse than no change - so the readout needs a separate deviation block whose amplitude (and direction) the data set; under iid-across-all-features the spatial betas are forced onto temporal change. (2026-10-09 revision; the earlier '2-3x more with a change-fitted beta' clause is withdrawn - the placebo arms showed that gain is spatial interpolation of observed change.)
  test: E011 change oracle (level vs change beta on the same features); E012 transfer (temporal beta fitted inside the trained era, applied to the withheld decades); split-kernel variants with a longer reference window.
  kill: A temporal beta learned from trained years captures no more withheld-decade change than the level beta.
  blr: If true, contract change - a separate temporal block (zbar/dz split, iid within block) whose beta the age model learns from BBS-era long-term change; the zbar reference window becomes a design choice.
  parents: [T4, B1]
  evidence:
  - {job: "adhoc:E011-dev", exp: E011, dir: for, strength: weak, note: "level beta 4-10% (base) / -5% (tempho1995 withheld) vs change beta 25-29% of available change, observed and DESK features alike. UNVERIFIED."}
  - {job: "E011/change-oracle-tempho1995_withheld-e8bd81e6849e", exp: E011, dir: for, strength: moderate, note: "verified (b) and (c) by an independent re-derivation (ridge-LOO, swapped halves): level readout of community change -0.043 to -0.056 captured into withheld decades; planted z species recover 0.98 with the same readout, so it is the species, not the instrument."}
  - {job: "adhoc:E011-placebo", exp: E011, dir: against, strength: moderate, note: "withdraws the change-fitted gain: position alone 0.30, static community 0.32-0.33, change 0.25-0.26; change adds +0.02 (DESK) / +0.05 (ESK) beyond static. Spatial interpolation of observed change, unavailable for 1902-1939."}
  - {job: "E012/split-variants-389bd4070d1c", exp: E012, dir: for, strength: weak, note: "split kernel (ref 1996-2025) vs iso, tempho1995 time set, place-specific, prevalence 0.1-0.3 / >=0.3: +0.020 / +0.035 vs -0.021 / -0.039; learned dz/zbar amplitude 0.09 - mostly shrinking the harmful temporal readout. Short reference window (2011-2025) loses it. UNVERIFIED."}
  - {job: "skeptic:E012", exp: E012, dir: against, strength: moderate, note: "the split kernel gain is matched by a placebo deviation block with no DESK content (24 position fields x linear time, extrapolated back): 0.033/0.038 vs C1 0.020/0.035; and it is not shrinkage (shrunk C0 scores <= +0.001). The ESK level readout is ~0, not negative, once half-A noise is removed: only DESK change read through level betas harms the backcast."}
- id: D0
  stage: T
  priority: 1
  status: testing
  statement: For the species readout, DESK's change into withheld decades carries as much linearly usable species-change information as the observed half-window community change - DESK's temporal information is not the first bottleneck.
  test: E011 desk:chg vs esk:chg across tempho 1975/1985/1995; an errors-in-variables-corrected observed comparator.
  kill: desk:chg falls below esk:chg beyond CI in the withheld decades, or an EIV-corrected observed comparator beats DESK clearly.
  blr: If true, improve the readout's temporal beta before DESK's temporal fidelity; DESK work waits on B7.
  parents: [E4, T0]
  evidence:
  - {job: "adhoc:E011-dev", exp: E011, dir: for, strength: weak, note: "tempho1995 withheld: desk_raw:chg captured 0.263 (r24) / 0.292 (r64) vs observed esk:chg 0.257 / 0.288; base 0.251 vs 0.257. The atlas's 0.3 correlation with ESK change does not stop it. Comparator is noisy (half window). UNVERIFIED."}
  - {job: "adhoc:E011-placebo", exp: E011, dir: neutral, strength: moderate, note: "uninformative as tested: neither DESK nor observed change carries much beyond location for real species (chg+static minus static +0.02 / +0.05); the tie measured equal spatial-basis value, not equal temporal information. Needs a test that a placebo cannot pass."}
- id: N1
  stage: E
  priority: 1
  status: open
  statement: Adjacent-cell differences contain a between-route nugget (sub-cell habitat, observer) that ESK discards and the same-route temporal change lacks, so matched-size comparisons of temporal vs spatial retention must use the structured spatial part.
  test: Direct nugget - Ruzicka cross-half differences between DIFFERENT routes in the SAME cell and years (route-level counts), and its ESK retention; or same- vs different-observer temporal pairs at matched dt.
  kill: The within-cell between-route difference is small (< 0.05 of the lag-1 signal) or ESK retains it like the structured part.
  blr: Decides R1. If the nugget is large, the 40-y change is ~100 km of structured turnover and truncation drops temporal directions (strong form) - a temporal-deviation basis becomes worth testing.
  parents: [R1, O3]
  evidence:
  - {job: "skeptic:E004", exp: E004, dir: for, strength: weak, note: "power-law variogram fits give a spatial nugget of 0.14-0.17 (35-38% of lag 1; admissible to 0.30); temporal intercept ~0."}
- id: B8
  stage: B
  priority: 1
  status: open
  statement: What the split kernel gains in the backcast is regional temporal TRENDS extrapolated back, not DESK's temporal deviations - a position x time block with no DESK content does as well.
  test: fast_arm placebo deviation block (position RFF x linear time) alone and alongside DESK's dz; C1 - placebo and (dz + placebo) - placebo by paired block bootstrap; tempho 1975/1985/1995.
  kill: DESK's dz adds significantly beyond the placebo block in at least two of three tempho caches.
  blr: If true, DESK's temporal deviations carry no transferable species information into withheld decades; a regional trend block would, but extrapolating trends 26-64 years back to 1902-1939 is its own risk - the age model's K trend is the place for it, with wide priors.
  parents: [B7, B5, B4]
  evidence:
  - {job: "skeptic:E012", exp: E012, dir: for, strength: weak, note: "placebo 0.033/0.038 (400 km) vs C1 0.020/0.035, time set; captured 0.127/0.069 vs 0.107/0.070; CIs overlap."}
- id: T10
  stage: T
  priority: 1
  status: testing
  statement: DESK's temporal predictions are miscalibrated - they move more than their correlation with the truth justifies, increasingly so into withheld decades - so reading them at face value adds noise to any backcast.
  test: Slope of the truth on DESK (centered, cross-half) by component, trained vs withheld; a per-component calibration shrink fitted in trained years and applied to withheld decades.
  kill: Truth-on-DESK slope near 1 once centered.
  blr: If true, DESK's temporal deviations need shrinkage before the age model sees them (or a block prior that can learn it); the readout should never inherit DESK's temporal amplitude as-is.
  parents: [T0]
  evidence:
  - {job: "skeptic:E004", exp: E004, dir: for, strength: moderate, note: "centered slope of truth on DESK 0.62 (trained) / 0.37 (withheld) equivalent; independent of target noise."}
  - {job: "adhoc:E016-dev", exp: E016, dir: for, strength: weak, note: "a linear within-cell map is calibrated (truth-on-prediction 0.75-0.91) where DESK is not (0.37-0.62): the over-movement is DESK-specific, not inherent to the task."}
  - {job: "skeptic3:E016", exp: E016, dir: neutral, strength: moderate, note: "CORRECTS the DESK-specific reading: DESK z deviations recalibrated by a trained-era within-cell BLR score 0.30-0.45 with slopes 0.88-1.05 -- the calibration gap was the recalibration step. A trained-era recalibration of DESK is cheap and carries calibration into withheld decades."}
# ---------------- added 2026-10-09 from the user's over/under-movement speculations ----------------
- id: S1
  stage: B
  priority: 1
  status: testing
  statement: (user, refined) Over-estimated similarity biases inference while under-estimated similarity only widens intervals. Refinement - in the age model's finite-rank readout (H = z.beta, beta pinned by modern data) a site-time's interval widens only with its leverage (distance outside the cloud of training z's), so a wrong z gives a confidently wrong habitat in either direction unless it leaves the cloud; under-movement (a modern map) is a bias too.
  test: Leverage of backcast z's vs training z's; coverage of the readout's habitat-level backcast intervals (B2); whether novel early covariates become high-leverage z's or are mapped into familiar territory (T9).
  kill: Backcast leverage rises in proportion to backcast error and habitat-level coverage is near nominal.
  blr: If the refinement holds, the backcast needs explicit feature uncertainty (an errors-in-variables variance growing with distance from the training years); accuracy alone is not the target.
  parents: [B2, T9, T10]
  evidence:
  - {job: "adhoc:E018-dev", exp: E018, dir: for, strength: moderate, note: "readout change intervals ~3x too narrow (sd) beyond the instrument floor (median R 126 vs 16 at r24), in trained years too; leverage does not flag errors (Spearman -0.08 to -0.27). UNVERIFIED."}
  - {job: "skeptic:E018", exp: E018, dir: for, strength: moderate, note: "magnitude revised: ~2x in sd (4.5x variance, CI 2.3-7.4x) beyond a stable planted floor; R tracks n; the core claim (intervals do not know the error; leverage does not flag it) survives."}
- id: S2
  stage: T
  priority: 1
  status: testing
  statement: (user) DESK's misdirected movement does not only make a cell-year dissimilar to its own past; it moves it toward other places' states - plausibly toward space-for-time analogs (places whose modern covariates match the cell's past covariates) - producing the over-similarity bias of S1.
  test: Alignment of DESK's backcast error with the analog direction (toward the modern states of covariate analogs) vs the true change's alignment; false-neighbour rate (DESK's nearest modern site-times vs the truth's).
  kill: DESK's backcast error is no more aligned with the analog direction than the true change is, and neighbour sets agree as well as noise allows.
  blr: If true, the backcast is confidently biased toward analog habitats; mitigations are direction (within-cell supervision, E016) and honest uncertainty, not shrinkage.
  parents: [T4, S1]
  evidence:
  - {job: "adhoc:E017-dev", exp: E017, dir: against, strength: weak, note: "DESK backcast moves are not toward covariate analogs (pull/alignment ~0 at r12/24/64, near or > 200 km); its readout neighbours are no worse than no-change. The bias is misdirected noise, not analog-structured. UNVERIFIED."}
  - {job: "adhoc:E017b-dev", exp: E017, dir: for, strength: moderate, note: "REVERSES the E017 reading. Along the corrected space-for-time direction (analogs of early minus analogs of modern covariates; centered): DESK backcast align +0.21 [0.15, 0.26] (> 200 km), as much as an explicit space-for-time map (+0.21); the truth -0.06; trained years DESK +0.09. Found by the skeptic, reproduced by our re-run; replications queued."}
- id: S3
  stage: T
  priority: 2
  status: testing
  statement: (user) Community responses lag covariates heterogeneously (places, times, covariates; up to century-scale vegetation processes), while spatial turnover is an equilibrium of mixed lags, so temporal extrapolation from spatial turnover is fraught for ANY covariate-based habitat model; a single global lag is always locally miscalibrated. Not solvable; must be respected.
  test: E016 (spatial vs within-cell coefficients on decadal change); a distributed-lag within-cell surrogate (covariates smoothed at several timescales); backcast error vs distance from the training years (tempho 1975/1985/1995).
  kill: Spatial and within-cell coefficients agree on decadal change, and one lag explains it as well as several.
  blr: Honest uncertainty for 1902-1939, and a sensitivity analysis of the vital-rate inference to the habitat backcast (rung 5, human-gated).
  parents: [T4, L1, T9]
  evidence:
  - {job: "adhoc:E016-dev", exp: E016, dir: for, strength: weak, note: "coefficients learned across space predict none of the decadal community change (corr 0.02-0.03); within-cell coefficients 0.27-0.42. UNVERIFIED."}
  - {job: "adhoc:E019-dev", exp: E019, dir: for, strength: weak, note: "same target window: backcast corr 0.42 -> 0.12, calibration 0.58 -> 0.20 over 0-28 years of reach; beyond ~10 y worse than no change. UNVERIFIED."}
  - {job: "E027/lags-nonlinear-surrogates-8675524399f2", exp: E027, dir: for, strength: moderate, note: "within-cell surrogates: several timescales of covariate history (incl. a 30-y EMA) backcast better than DESK-timescale covariates at long spans (lags+trend - cov+trend +0.07/+0.08 at T0 1986/1976, CI > 0); lag30 is usually the best single timescale; no gain at short spans. UNVERIFIED."}
  - {job: "E027/desk-plus-covariate-blocks-6977de015080", exp: E027, dir: against, strength: weak, note: "added to DESK's own recalibration, slow history adds only +0.02-0.05 (CI mostly spans 0 at the farthest windows): DESK's z already carries most of it. UNVERIFIED."}
- id: N2
  stage: T
  priority: 1
  status: testing
  statement: Decadal temporal relationships (community trends, covariate -> community change) are non-stationary, so the trained years NEAREST the target carry the transferable temporal information and long training spans dilute it -- the backcast depends on where the training mass sits, not on how much history there is (user, 2026-10-09, asked whether long-reach failures are reach or short training).
  test: E023 span x reach with surrogates (and DESK recalibrated per span); E024 DESK trained on short spans near the target vs long spans, matched reach.
  kill: At fixed reach, longer spans backcast as well or better (surrogates and DESK).
  blr: If true, whatever learns the temporal mapping (DESK, its recalibration, the readout's temporal block) should weight the earliest BBS decades for a 1902-1939 backcast; 60 years of history by itself will not help.
  parents: [S3, E3]
  evidence:
  - {job: "adhoc:E023-dev", exp: E023, dir: for, strength: moderate, note: "surrogates: at fixed (T0, W) longer spans backcast worse (e.g. trend 0.177 / 0.104 / 0.063 for 10 / 20 / 30 years at 27.5 y reach; 0.290 -> 0.094 over 10-50 years at 7.5 y); unchanged with years balanced and at r64. DESK recalibrated on its nearest decade: 0.187 (calib 1.09) vs 0.111 full-span vs 0.057 raw. UNVERIFIED."}
  - {job: "E023/span-reach-desk-spans-seeds-f490c66f67af", exp: E024, dir: against, strength: moderate, note: "DESK trained on 20-year spans next to the target vs the same-T0 long-span HEAD seeds, raw backcast of 1966-71: 0.102 vs 0.122/0.105 (T0 1996), 0.143 vs 0.136/0.112 (T0 1986), 0.082 vs archived 0.110 (T0 1976). Pre-registered rule (2 of 3 by > seed spread) NOT met; short spans win at 1972-77 (+0.03-0.05) only. DESK does not show the surrogates' strong span dependence. One seed per span model. UNVERIFIED."}
- id: T11
  stage: T
  priority: 1
  status: testing
  statement: DESK's temporal extrapolation is optimization-limited -- one optimizer step per epoch (500 in all) and a noisy metric-term gradient (the only cross-year supervision) leave temporal structure under-learned, so less gradient noise (more metric pairs) or more steps would extend backcasts. Candidate explanation for why current-code retrains (65,536 pairs) backcast ~50-100% better than the archived tempho models (4,096 pairs).
  test: E026 tempho1995 at metric_pairs 4,096 / 65,536 / 262,144, backcast by span_reach and reach_curve; E025 selected vs late epochs (does more training keep improving the temporal direction?).
  kill: mp4096 and mp262k backcast within the seed spread of the 65,536 seeds.
  blr: If true, the backcast quality the BLR inherits depends on DESK's optimization budget along the temporal axis, which is cheap to raise; the production checkpoint (trained at 65,536 pairs, 500 steps) may be leaving temporal skill unlearned.
  parents: [T1]
  evidence:
  - {job: "adhoc:desk_hp-trajectories", exp: E026, dir: against, strength: weak, note: "archived sweep logs (trained years, held-out cells): direction cosine plateaus at 0.21-0.22 after epoch ~100 in the base run; 16 optimizer steps per epoch (tiles32, to epoch 260) and metric weights 20-100 do not raise it. Rotation keeps rising. Says nothing yet about withheld years (E025/E026)."}
